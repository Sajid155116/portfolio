name: Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize build log
        run: touch build.log

      - name: Run lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Send CI/CD logs to external API when build fails
        if: failure()
        continue-on-error: true
        run: |
          if [ ! -f build.log ]; then
            echo "::warning::build.log not found. Skipping API log send."
            exit 0
          fi

          tail -n 150 build.log > trimmed.log
          grep -iE "error|fail|exception" build.log >> trimmed.log || true

          if [ ! -s trimmed.log ]; then
            echo "::warning::trimmed.log is empty. Skipping API log send."
            exit 0
          fi

          LOG_CONTENT="$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e ':a;N;$!ba;s/\n/\\n/g' trimmed.log)"
          JSON_PAYLOAD="{\"projectName\":\"portfolio\",\"logs\":\"${LOG_CONTENT}\",\"status\":\"failed\"}"

          RESPONSE="$(curl -s -X POST "https://ai-devops-assistant-ryhg.onrender.com/analyze-logs" \
            -H "Content-Type: application/json" \
            --data "${JSON_PAYLOAD}")"

          echo "${RESPONSE}"
          echo "${RESPONSE}" > response.json

      - name: Send CI/CD logs to external API when build succeeds
        if: success()
        continue-on-error: true
        run: |
          if [ ! -f build.log ]; then
            echo "::warning::build.log not found. Skipping API log send."
            exit 0
          fi

          tail -n 100 build.log > success.log

          if [ ! -s success.log ]; then
            echo "::warning::success.log is empty. Skipping API log send."
            exit 0
          fi

          LOG_CONTENT="$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e ':a;N;$!ba;s/\n/\\n/g' success.log)"
          JSON_PAYLOAD="{\"projectName\":\"portfolio\",\"logs\":\"${LOG_CONTENT}\",\"status\":\"success\"}"

          RESPONSE="$(curl -s -X POST "https://ai-devops-assistant-ryhg.onrender.com/analyze-logs" \
            -H "Content-Type: application/json" \
            --data "${JSON_PAYLOAD}")"

          echo "${RESPONSE}"

      - name: Parse API response and export fields
        if: failure()
        run: |
          SUMMARY=""
          ROOT_CAUSE=""
          FIX_SUGGESTION=""

          if [ ! -s response.json ]; then
            echo "::warning::response.json is missing or empty. Exporting empty response fields."
          elif ! jq empty response.json >/dev/null 2>&1; then
            echo "::warning::response.json is not valid JSON. Exporting empty response fields."
          else
            SUMMARY="$(jq -r 'if (.summary | type) == "string" then .summary else "" end' response.json 2>/dev/null || true)"
            ROOT_CAUSE="$(jq -r 'if (.rootCause | type) == "string" then .rootCause else "" end' response.json 2>/dev/null || true)"
            FIX_SUGGESTION="$(jq -r 'if (.fixSuggestion | type) == "string" then .fixSuggestion else "" end' response.json 2>/dev/null || true)"
          fi

          {
            echo "SUMMARY<<EOF"
            echo "${SUMMARY}"
            echo "EOF"
            echo "ROOT_CAUSE<<EOF"
            echo "${ROOT_CAUSE}"
            echo "EOF"
            echo "FIX_SUGGESTION<<EOF"
            echo "${FIX_SUGGESTION}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Post AI analysis comment on Pull Request
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          JSON_PAYLOAD="$(jq -n \
            --arg summary "${SUMMARY}" \
            --arg root_cause "${ROOT_CAUSE}" \
            --arg fix_suggestion "${FIX_SUGGESTION}" \
            '{
              body: "❌ Build Failed\n\n🧠 AI Analysis:\n- Summary: \($summary)\n\n🔍 Root Cause:\n\($root_cause)\n\n✅ Suggested Fix:\n\($fix_suggestion)"
            }')"

          curl -v -X POST "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data "${JSON_PAYLOAD}"

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-ci-logs
          path: |
            build.log
            trimmed.log
            response.json
          if-no-files-found: warn
