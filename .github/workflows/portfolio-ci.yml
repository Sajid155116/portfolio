name: Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize build log
        run: touch build.log

      - name: Run lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Send CI/CD logs to external API when build fails
        if: failure()
        continue-on-error: true
        run: |
          if [ ! -f build.log ]; then
            echo "::warning::build.log not found. Skipping API log send."
            exit 0
          fi

          tail -n 150 build.log > trimmed.log
          grep -iE "error|fail|exception" build.log >> trimmed.log || true

          if [ ! -s trimmed.log ]; then
            echo "::warning::trimmed.log is empty. Skipping API log send."
            exit 0
          fi

          LOG_CONTENT="$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e ':a;N;$!ba;s/\n/\\n/g' trimmed.log)"
          JSON_PAYLOAD="{\"logs\":\"${LOG_CONTENT}\"}"

          HTTP_CODE="$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST "https://ai-devops-assistant-ryhg.onrender.com/analyze-logs" \
            -H "Content-Type: application/json" \
            --data "${JSON_PAYLOAD}")"

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::warning::Failed to send logs to API. HTTP ${HTTP_CODE}."
          else
            echo "Logs sent to external API successfully."
          fi

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-ci-logs
          path: |
            build.log
            trimmed.log
            response.txt
          if-no-files-found: warn
