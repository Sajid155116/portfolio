name: Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare log directory
        run: mkdir -p .ci-logs

      - name: Run lint (fail-fast with structured logs)
        run: |
          set -o pipefail
          echo "::group::Lint Output"
          echo "[lint][start] $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee .ci-logs/lint.log
          npm run lint 2>&1 | tee -a .ci-logs/lint.log
          LINT_EXIT=${PIPESTATUS[0]}
          echo "[lint][end] $(date -u +'%Y-%m-%dT%H:%M:%SZ') exit_code=${LINT_EXIT}" | tee -a .ci-logs/lint.log
          echo "::endgroup::"
          if [ "$LINT_EXIT" -ne 0 ]; then
            echo "::error title=Lint Failed::Lint step failed. See .ci-logs/lint.log for details."
            exit "$LINT_EXIT"
          fi

      - name: Run build (fail-fast with structured logs)
        run: |
          set -o pipefail
          echo "::group::Build Output"
          echo "[build][start] $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee .ci-logs/build.log
          npm run build 2>&1 | tee -a .ci-logs/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "[build][end] $(date -u +'%Y-%m-%dT%H:%M:%SZ') exit_code=${BUILD_EXIT}" | tee -a .ci-logs/build.log
          echo "::endgroup::"
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error title=Build Failed::Build step failed. See .ci-logs/build.log for details."
            exit "$BUILD_EXIT"
          fi

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-ci-logs
          path: .ci-logs/
          if-no-files-found: warn
